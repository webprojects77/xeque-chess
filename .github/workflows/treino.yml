name: treino
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      minutos:
        description: duracao alvo da rodada em minutos
        default: '150'
permissions:
  contents: write
concurrency:
  group: treino
  cancel-in-progress: false
jobs:
  treinar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          pip install chess
      - run: node treino/rodada.js ${{ inputs.minutos || '150' }}
      - run: |
          git config user.name xeque-treino
          git config user.email xeque-treino@users.noreply.github.com
          git add weights.json treino/historico.json
          git diff --cached --quiet || git commit -m "treino: rodada automatica"
          git pull --rebase -q
          git push
