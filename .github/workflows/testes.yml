name: testes
on:
  push:
    branches: [main]
    paths-ignore:
      - weights.json
      - treino/historico.json
  pull_request:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.js
