<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xeque</title>
<style>
:root{--l:#eed9b6;--d:#b58863;--bs:min(94vw,520px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#1d1d22;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;min-height:100vh}
h1{font-size:20px;margin:4px 0 10px}
#bd{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:var(--bs);height:var(--bs);border-radius:6px;overflow:hidden;user-select:none}
.s{display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.86);position:relative;line-height:1;min-width:0;min-height:0;overflow:hidden}
.s.l{background:var(--l)}.s.d{background:var(--d)}
.s.last{background:#cdd26a!important}.s.sel{background:#f6f669!important}.s.chk{background:#e66!important}
.s.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.28)}
.s.cp::after{content:"";position:absolute;inset:5%;border-radius:50%;border:4px solid rgba(0,0,0,.28)}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}
.k{color:#111;text-shadow:0 0 1px #fff}
#st{margin:12px 0 2px;font-size:17px;min-height:24px;text-align:center}
#in{font-size:13px;opacity:.75;min-height:54px;margin-bottom:6px;text-align:center;line-height:1.4}
.r{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
button,select{background:#33333c;color:#eee;border:0;border-radius:8px;padding:10px 14px;font-size:15px}
button:active{background:#4a4a55}
#cr{position:fixed;right:10px;bottom:max(6px,env(safe-area-inset-bottom));font-size:11px;opacity:.45;pointer-events:none}
</style>
</head>
<body>
<h1>♞ Xeque</h1>
<div id="bd"></div>
<div id="st"></div>
<div id="in"><div id="i1"></div><div id="i2"></div><div id="i3"></div></div>
<div class="r">
<button id="nw">Novo jogo</button>
<button id="fl">Virar</button>
<select id="sd"><option value="0">Jogo de brancas</option><option value="1">Jogo de pretas</option></select>
</div>
<div id="cr">Feito por Davi Ch.</div>
<script src="engine.js?v=6"></script>
<script>
const X=Xeque,T1=3000,T2=1200,T3=1500,TH=60;
const G=['','♟','♞','♝','♜','♛','♚'];
const $=id=>document.getElementById(id);
let moves=[],human=0,flip=false,sel=-1,busy=false,over='',last=[-1,-1],w=null,sf=null,sfOk=null,sfCb=null,sfInfo=null,sfMulti=null,jid=0,MEM={};
try{MEM=JSON.parse(localStorage.getItem('xeque_mem')||'{}');}catch(e){MEM={};}
function learn(k,g,b){
  const e=MEM[k]||{g:'',b:[]};
  if(g)e.g=g;
  if(b&&e.b.indexOf(b)<0)e.b.push(b);
  MEM[k]=e;
  const ks=Object.keys(MEM);if(ks.length>20000)delete MEM[ks[0]];
  try{localStorage.setItem('xeque_mem',JSON.stringify(MEM));}catch(x){}
}
const lessons=()=>Object.keys(MEM).length;

function mk(){try{w=new Worker('engine.js?v=6');w.onerror=()=>{w=null;};}catch(e){w=null;}}
mk();

function fmt(i){return 'prof. '+i.d+' · '+(Math.abs(i.v)>=90000?'mate':(i.v/100).toFixed(2));}
function sfStart(){
  if(sf)return sfOk;
  sfOk=new Promise((res,rej)=>{
    try{
      sf=new Worker('stockfish/stockfish-19-lite-single.js');
      sf.onerror=()=>{sf=null;rej();};
      sf.onmessage=e=>{
        const l=typeof e.data=='string'?e.data:'';
        if(l=='uciok')sf.postMessage('isready');
        else if(l=='readyok'&&res){sf.postMessage('setoption name Hash value 32');res();res=null;}
        else if(l.startsWith('info')&&l.indexOf('bound')<0){
          const d=/ depth (\d+)/.exec(l),c=/ score (cp|mate) (-?\d+)/.exec(l),p=/ pv (\S+)/.exec(l);
          if(d&&c){
            const v=c[1]=='mate'?(+c[2]>0?1:-1)*(100000-Math.abs(+c[2])):+c[2];
            if(sfInfo)sfInfo({d:+d[1],v});
            if(sfMulti&&p)sfMulti[p[1]]=v;
          }
        }
        else if(l.startsWith('bestmove')&&sfCb){const cb=sfCb;sfCb=null;cb(l.split(' ')[1]);}
      };
      sf.postMessage('uci');
    }catch(x){sf=null;rej();}
  });
  return sfOk;
}
function sfStop(){if(sf){sf.terminate();sf=null;}sfCb=null;sfInfo=null;sfMulti=null;}
function pos(mv){return 'position startpos'+(mv.length?' moves '+mv.join(' '):'');}
function sfRun(mv,ms,cb,fail){
  sfStart().then(()=>{
    sfMulti=null;
    sfInfo=i=>{$('i2').textContent='Stockfish (supervisor): '+fmt(i);};
    sf.postMessage(pos(mv));
    sfCb=cb;sf.postMessage('go movetime '+ms);
  }).catch(()=>{if(fail)fail();else cb(null);});
}
function sfCompare(mv,list,cb){
  sfStart().then(()=>{
    const sc={};sfMulti=sc;sfInfo=null;
    sf.postMessage('setoption name MultiPV value '+list.length);
    sf.postMessage(pos(mv));
    sfCb=()=>{sfMulti=null;sf.postMessage('setoption name MultiPV value 1');cb(sc);};
    sf.postMessage('go movetime '+T2+' searchmoves '+list.join(' '));
  }).catch(()=>cb(null));
}
function xqRun(job,mv,ms,ex,cb){
  if(w){
    w.onmessage=e=>{
      if(job!=jid)return;
      if(e.data.info)$('i1').textContent='Xeque (principal): '+fmt(e.data.info);
      else if(e.data.best)cb(e.data.best);
    };
    w.postMessage({fen:X.START,moves:mv,ms:ms,depth:64,temp:0,ex:ex});
  }else setTimeout(()=>{
    if(job!=jid)return;
    sync();const m=X.think(ms,64,0,i=>{$('i1').textContent='Xeque (principal): '+fmt(i);},ex);
    cb(X.uci(m));
  },50);
}

function sync(){X.setup(X.START,moves);}
function kingSq(){for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=X.at(f,r);if((p&7)==6&&(p>>3)==X.side())return r*16+f;}return -1;}
function render(){
  const lg=X.legal().filter(m=>(m&127)==sel),tg={};
  for(const m of lg)tg[m>>7&127]=1;
  const kc=X.inCheck()?kingSq():-1;
  let h='';
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const r=flip?i:7-i,f=flip?7-j:j,sq=r*16+f,p=X.at(f,r);
    let c='s '+((r+f)%2?'l':'d');
    if(sq==last[0]||sq==last[1])c+=' last';
    if(sq==sel)c+=' sel';
    if(sq==kc)c+=' chk';
    if(tg[sq])c+=p?' cp':' mv';
    h+='<div class="'+c+'" data-q="'+sq+'">'+(p?'<span class="'+((p>>3)?'k':'w')+'">'+G[p&7]+'\uFE0E</span>':'')+'</div>';
  }
  $('bd').innerHTML=h;
  $('st').textContent=over||(busy?'Pensando…':X.side()==human?'Sua vez':'Vez do computador');
}
function check(){
  const s=X.status();
  if(s=='mate')over='Xeque-mate! '+(X.side()==human?'O computador ganhou.':'Você ganhou!');
  else if(s=='stalemate')over='Empate por afogamento.';
  else if(s)over='Empate.';
  else over='';
}
function apply(u){
  if(!busy||!u)return;
  jid++;moves.push(u);sync();
  last=[(u.charCodeAt(1)-49)*16+u.charCodeAt(0)-97,(u.charCodeAt(3)-49)*16+u.charCodeAt(2)-97];
  busy=false;sel=-1;check();render();
}
function think(){
  const job=++jid,mv=moves.slice(),key=X.key(),mem=MEM[key];
  $('i1').textContent='Xeque (principal): pensando…';$('i2').textContent='Stockfish (supervisor): pensando…';$('i3').textContent='';
  const play=(u,t)=>{if(job!=jid)return;$('i3').textContent=t+' · lições guardadas: '+lessons();apply(u);};
  if(mem&&mem.g&&X.parse(mem.g)){play(mem.g,'Xeque lembrou de uma lição e jogou direto.');return;}
  const ex=mem?mem.b.slice():[];
  let xm=null,sm=null,xd=false,sd=false;
  const fin=()=>{
    if(job!=jid||!xd||!sd)return;
    if(!sm){play(xm,'Stockfish indisponível: o Xeque jogou sozinho.');return;}
    if(xm==sm){learn(key,xm);play(xm,'Stockfish aprovou o lance do Xeque.');return;}
    $('i3').textContent='Stockfish está conferindo o lance do Xeque…';
    sfCompare(mv,[sm,xm],sc=>{
      if(job!=jid)return;
      if(!sc||sc[sm]==null||sc[xm]==null){play(xm,'Xeque jogou (conferência indisponível).');return;}
      const loss=sc[sm]-sc[xm];
      if(loss<=TH){learn(key,xm);play(xm,'Stockfish aprovou o lance do Xeque.');return;}
      learn(key,sm,xm);
      $('i3').textContent='Stockfish avisou: '+xm+' perde '+(loss/100).toFixed(1)+'. Xeque está refazendo…';
      xqRun(job,mv,T3,ex.concat([xm]),x2=>{
        if(job!=jid)return;
        if(x2==sm){learn(key,sm);play(sm,'Xeque se corrigiu e chegou no lance do Stockfish.');return;}
        sfCompare(mv,[sm,x2],s2=>{
          if(job!=jid)return;
          if(s2&&s2[sm]!=null&&s2[x2]!=null&&s2[sm]-s2[x2]<=TH){learn(key,x2);play(x2,'Xeque se corrigiu sozinho.');return;}
          learn(key,sm,x2);play(sm,'Stockfish insistiu e jogou '+sm+'.');
        });
      });
    });
  };
  xqRun(job,mv,T1,ex,m=>{xm=m;xd=true;fin();});
  sfRun(mv,T1,b=>{sm=b;sd=true;fin();},()=>{sm=null;sd=true;fin();});
}
function engineMove(){
  if(over)return render();
  busy=true;render();think();
}
$('bd').onclick=e=>{
  const el=e.target.closest('.s');if(!el||busy||over||X.side()!=human)return;
  const sq=+el.dataset.q,mv=X.legal().filter(m=>(m&127)==sel&&(m>>7&127)==sq);
  if(mv.length){
    const m=mv.find(x=>(x>>17&7)==5)||mv[0];
    moves.push(X.uci(m));sync();
    last=[m&127,m>>7&127];sel=-1;check();render();
    if(!over)engineMove();
    return;
  }
  const p=X.at(sq&7,sq>>4);
  sel=p&&(p>>3)==human?sq:-1;render();
};
function nw(){
  jid++;moves=[];human=+$('sd').value;flip=human==1;sel=-1;over='';busy=false;last=[-1,-1];
  X.reset();if(w){w.terminate();mk();}sfStop();
  sync();$('i1').textContent='';$('i2').textContent='';$('i3').textContent='Lições guardadas: '+lessons();render();
  if(human==1)engineMove();
}
$('nw').onclick=nw;
$('fl').onclick=()=>{flip=!flip;render();};
nw();
</script>
</body>
</html>
